<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | Court Auction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-100 text-zinc-950">
  <main class="flex min-h-screen items-center justify-center px-4 py-10">
    <section class="w-full max-w-md rounded-md border border-zinc-200 bg-white p-6 shadow-sm">
      <p class="text-sm font-black text-emerald-700">Court Asset Intelligence</p>
      <h1 class="mt-2 text-2xl font-black">로그인</h1>
      <p class="mt-2 text-sm leading-6 text-zinc-600">사용자별 패스 목록과 검토 화면을 사용하려면 로그인하세요.</p>
      {% if error %}
        <div class="mt-4 rounded-md border border-rose-200 bg-rose-50 p-3 text-sm font-bold text-rose-800">아이디 또는 비밀번호를 확인하세요.</div>
      {% endif %}
      <form action="/login" method="post" class="mt-5 space-y-4">
        <input type="hidden" name="next_url" value="{{ next_url }}">
        <label class="block">
          <span class="text-sm font-bold text-zinc-700">아이디</span>
          <input name="username" autocomplete="username" class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2" required>
        </label>
        <label class="block">
          <span class="text-sm font-bold text-zinc-700">비밀번호</span>
          <input name="password" type="password" autocomplete="current-password" class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2" required>
        </label>
        <button class="w-full rounded-md bg-zinc-950 px-4 py-2.5 text-sm font-black text-white" type="submit">로그인</button>
      </form>
      <p class="mt-4 rounded-md bg-zinc-50 p-3 text-xs leading-5 text-zinc-500">초기 로컬 계정은 환경변수로 바꿀 수 있습니다. 기본값은 `admin / admin1234!`입니다.</p>
    </section>
  </main>
</body>
</html>
