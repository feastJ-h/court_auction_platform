<div
  class="flex max-w-full flex-nowrap gap-2 overflow-x-auto overscroll-x-contain py-1 text-sm font-bold"
  data-nav-scope="local-filter"
  data-onbid-category-tabs="true"
  data-active-section="{{ active_section|default('') }}"
  data-active-category="{{ active_category|default('') }}"
>
  {% for link in category_links %}
    <a class="inline-flex min-h-11 shrink-0 items-center rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600 {% if active_category == link.value %}bg-zinc-950 text-white{% else %}border border-zinc-300 bg-white text-zinc-800 hover:border-zinc-500{% endif %}" data-category-tab="{{ link.value }}" href="{{ link.href }}" {% if active_category == link.value %}aria-current="page"{% endif %}>
      {{ link.label }} <span class="opacity-75">{{ link.count }}</span>
    </a>
  {% endfor %}
</div>
