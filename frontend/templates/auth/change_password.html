<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 | Court Auction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-100 text-zinc-950">
  <main class="mx-auto flex min-h-screen max-w-xl items-center px-4 py-10">
    <section class="w-full rounded-md border border-zinc-200 bg-white p-6 shadow-sm">
      <div class="mb-6">
        <p class="text-sm font-black text-emerald-700">Account Security</p>
        <h1 class="mt-1 text-2xl font-black">비밀번호 변경</h1>
        <p class="mt-2 text-sm text-zinc-600">{{ current_user.display_name }} 계정의 로그인 비밀번호를 변경합니다.</p>
      </div>

      {% if error %}
        <div class="mb-4 rounded-md border border-rose-200 bg-rose-50 p-3 text-sm font-bold text-rose-800">
          비밀번호를 변경하지 못했습니다. 현재 비밀번호와 새 비밀번호 길이를 확인해 주세요.
        </div>
      {% endif %}
      {% if success %}
        <div class="mb-4 rounded-md border border-emerald-200 bg-emerald-50 p-3 text-sm font-bold text-emerald-800">
          비밀번호가 변경되었습니다.
        </div>
      {% endif %}

      <form action="/account/password" method="post" class="space-y-4">
        <label class="block">
          <span class="text-sm font-bold text-zinc-700">현재 비밀번호</span>
          <input name="current_password" type="password" required class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2">
        </label>
        <label class="block">
          <span class="text-sm font-bold text-zinc-700">새 비밀번호</span>
          <input name="new_password" type="password" minlength="8" required class="mt-1 w-full rounded-md border border-zinc-300 px-3 py-2">
        </label>
        <button type="submit" class="w-full rounded-md bg-zinc-950 px-4 py-3 text-sm font-black text-white">변경 저장</button>
      </form>

      <div class="mt-5 flex flex-wrap gap-2 text-sm font-bold">
        <a href="/user" class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-zinc-800">사용자 화면</a>
        <a href="/logout" class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-zinc-800">로그아웃</a>
      </div>
    </section>
  </main>
</body>
</html>
