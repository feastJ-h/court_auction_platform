name: beta-release-gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  default-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      APP_SECRET_KEY: ci-only-secret-not-for-production-000000000
      DB_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - run: npm ci
      - run: npm run build:css
      - run: python -m pytest -m "not integration and not external and not visual" --junitxml=test-results.xml
      - name: banned public copy and mojibake scan
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path("frontend/templates"), Path("frontend/static")]
          banned = ["수익률 보장", "무조건 추천", "AI 권리분석", "안전한 물건"]
          bad = []
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix in {".html", ".js", ".css"}:
                      text = path.read_text(encoding="utf-8")
                      bad += [(str(path), token) for token in banned if token in text]
          if bad: raise SystemExit(str(bad))
          PY
      - run: pip-audit -r requirements.txt
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results.xml
