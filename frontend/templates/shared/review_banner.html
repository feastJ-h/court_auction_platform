{% if review_mode and current_user and current_user.role == 'admin' %}
  <div class="border-b border-amber-300 bg-amber-100 px-4 py-2 text-xs font-bold text-amber-950" data-review-mode="true">
    관리자 리뷰 모드 · 변경과 실 API 동기화가 제한됩니다.
  </div>
{% elif settings.beta_mode or review_mode %}
  <div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-xs font-bold text-amber-950" data-beta-mode="true" {% if review_mode %}data-review-mode="true"{% endif %}>
    베타 서비스 · 일부 자료는 누락되거나 변경될 수 있습니다. 최종 확인은 원문에서 진행하세요.
  </div>
{% endif %}
