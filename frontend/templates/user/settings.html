<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 설정 | Court Auction</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-zinc-50 text-zinc-950">
  <main class="mx-auto max-w-4xl px-4 py-8">
    <header class="mb-6 flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="text-sm font-black text-emerald-700">{{ current_user.display_name }}님의 설정</p>
        <h1 class="mt-1 text-2xl font-black">내 설정</h1>
        <p class="mt-2 text-sm text-zinc-600">계정과 개인 검토 환경을 관리합니다.</p>
      </div>
      <div class="flex flex-wrap gap-2 text-sm font-bold">
        <a class="rounded-md bg-zinc-950 px-4 py-2 text-white" href="/user">회생·파산</a>
        <a class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-zinc-800" href="/auctions">온비드 공매</a>
        <a class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-zinc-800" href="/user/my">내 보관함</a>
        {% if current_user.role == 'admin' %}
          <a class="rounded-md border border-indigo-300 bg-indigo-50 px-4 py-2 text-indigo-800" href="/admin">Admin</a>
        {% endif %}
        <a class="rounded-md border border-zinc-300 bg-white px-4 py-2 text-zinc-800" href="/logout">로그아웃</a>
      </div>
    </header>

    <section class="grid gap-4 md:grid-cols-2">
      <article class="rounded-md border border-zinc-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-black">계정 보안</h2>
        <p class="mt-2 text-sm leading-6 text-zinc-600">비밀번호는 주기적으로 교체하고, 관리자 계정은 테스트 후에도 별도로 관리하세요.</p>
        <a class="mt-4 inline-flex rounded-md bg-zinc-950 px-4 py-2 text-sm font-black text-white" href="/account/password">비밀번호 변경</a>
      </article>
      <article class="rounded-md border border-zinc-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-black">개인 목록</h2>
        <p class="mt-2 text-sm leading-6 text-zinc-600">관심, 지켜보기, 패스는 한 물건당 하나만 유지됩니다.</p>
        <div class="mt-4 flex flex-wrap gap-2 text-sm font-bold">
          <a class="rounded-md border border-emerald-300 bg-emerald-50 px-3 py-2 text-emerald-800" href="/user/bookmarks">관심</a>
          <a class="rounded-md border border-blue-300 bg-blue-50 px-3 py-2 text-blue-800" href="/user/watching">지켜보기</a>
          <a class="rounded-md border border-zinc-300 bg-white px-3 py-2 text-zinc-700" href="/user/passed">패스</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
